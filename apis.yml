aid: boaconsulta
name: BoaConsulta
description: >-
  BoaConsulta is a Brazilian digital-health platform, founded in 2012 and part of
  the Pixeon healthtech group, that connects patients, health professionals, and
  institutions. It pairs a free B2C marketplace for booking in-person consultations,
  teleconsultations, exams, and vaccinations with a full B2B/SaaS practice-management
  system (150+ integrated modules covering smart scheduling, electronic health
  records, telemedicine, financial management, TISS insurance billing, inventory,
  and automated reminders). The platform reports more than 58,000 health
  professionals, 1.7 million registered patients, and over 2 million appointments,
  with LGPD-compliant end-to-end encryption and daily automated backups. It has no
  public developer API; this profile is enriched from BoaConsulta's own public
  surfaces (llms.txt, status page, help center, blog, and legal pages).
